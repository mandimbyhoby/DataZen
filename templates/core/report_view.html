{% extends "core/base.html" %}

{% block title %}Rapport — {{ data_file.original_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'core:index' %}">Accueil</a></li>
            <li class="breadcrumb-item"><a href="{% url 'core:dataset_detail' data_file.pk %}">{{ data_file.original_name }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">Rapport</li>
        </ol>
    </nav>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <h1 class="h3 mb-0">📋 Rapport de nettoyage</h1>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" href="{% url 'core:dataset_detail' data_file.pk %}">
                ← Retour au fichier
            </a>
            <a class="btn btn-outline-secondary" href="{% url 'core:download_report' data_file.pk %}">
                📥 Markdown (.md)
            </a>
            <a class="btn btn-primary" href="{% url 'core:download_report_html' data_file.pk %}">
                🌐 HTML (.html)
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body report-content">
            {{ report_html|safe }}
        </div>
    </div>
</div>
{% endblock %}
